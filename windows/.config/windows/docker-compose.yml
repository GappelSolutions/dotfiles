services:
  windows:
    image: dockurr/windows
    container_name: nix-windows
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      USERNAME: "${WINDOWS_USERNAME:-cgpp}"
      TZ: "Europe/Berlin"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 127.0.0.1:8006:8006
      - 127.0.0.1:3389:3389/tcp
      - 127.0.0.1:3389:3389/udp
      - 127.0.0.1:2222:22/tcp
    volumes:
      - /home/cgpp/.windows:/storage
      - /home/cgpp/Windows:/shared
    restart: unless-stopped
    stop_grace_period: 2m
