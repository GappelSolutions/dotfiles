[mgr]
show_hidden = true
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[preview]
wrap = "no"
tab_size = 2
max_width = 1600
max_height = 1600
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
	{ run = 'vis "$@"', block = true, for = "unix" },
	{ run = 'vis %*', block = true, for = "windows" },
]
play = [
	{ run = 'ffplay -autoexit "$1"', desc = "Play video", orphan = true },
]

[open]
prepend_rules = [
	{ mime = "video/*", use = "play" },
]

# Windows network drives: don't preview/preload files there - each preview downloads the file over
# SMB. Folder previews (patterns ending in /) stay on. Windows paths are matched with / separators;
# drive-letter patterns never match on the unix hosts.
[plugin]
prepend_preloaders = [
	{ url = "{L,M,P,T,X,Y,Z}:/**", run = "noop" },
]
prepend_previewers = [
	{ url = "{L,M,P,T,X,Y,Z}:/**", run = "noop" },
]
