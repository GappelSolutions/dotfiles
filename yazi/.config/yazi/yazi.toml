[mgr]
show_hidden = false
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[preview]
wrap = "no"
tab_size = 2
max_width = 1600
max_height = 1600
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
	{ run = 'vis "$@"', block = true, for = "unix" },
	{ run = 'vis %*', block = true, for = "windows" },
]
play = [
	{ run = 'ffplay -autoexit "$1"', desc = "Play video", orphan = true },
]
# yazi's preset, but on Windows:
# - drops Rio's WGPU_BACKEND=gl (rio/config.toml) before handing the file to its default app: wgpu
#   apps quit silently on the GL backend
# - ShellExecute via rundll32, not cmd's start: start refuses files someone else has open in Word on
#   a share ("being used by another process"), and yazi swallows the error, so Enter did nothing
open = [
	{ run = "xdg-open %s1",    desc = "Open", for = "linux" },
	{ run = "open %s",         desc = "Open", for = "macos" },
	{ run = 'set WGPU_BACKEND=& rundll32 shell32.dll,ShellExec_RunDLL %s1', desc = "Open", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Open", for = "android" },
]

[open]
prepend_rules = [
	{ mime = "video/*", use = "play" },
]

# Windows network drives: don't preview/preload files there - each preview downloads the file over
# SMB. Folder previews (patterns ending in /) stay on. Windows paths are matched with / separators;
# drive-letter patterns never match on the unix hosts.
[plugin]
prepend_preloaders = [
	{ url = "{L,M,P,T,X,Y,Z}:/**", run = "noop" },
]
prepend_previewers = [
	{ url = "{L,M,P,T,X,Y,Z}:/**", run = "noop" },
]
