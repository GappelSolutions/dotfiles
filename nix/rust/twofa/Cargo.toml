[package]
name = "twofa"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
data-encoding = "2.6"
hmac = "0.12"
ratatui = "0.29"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
zeroize = "1.8"

[[bin]]
name = "2fa"
path = "src/main.rs"
