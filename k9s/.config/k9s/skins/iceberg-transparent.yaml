# -----------------------------------------------------------------------------
# Iceberg Dark (transparent) - matches alacritty.toml colors
# -----------------------------------------------------------------------------

foreground: &foreground "#c6c8d1"
background: &background "default"
current_line: &current_line "#1e2132"
selection: &selection "#1e2132"
comment: &comment "#6b7089"
black: &black "#161821"
blue: &blue "#84a0c6"
cyan: &cyan "#89b8c2"
green: &green "#b4be82"
magenta: &magenta "#a093c7"
red: &red "#e27878"
white: &white "#c6c8d1"
yellow: &yellow "#e2a478"

k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *blue
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *comment
  info:
    fgColor: *magenta
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *magenta
    buttonFocusFgColor: *black
    buttonFocusBgColor: *yellow
    labelFgColor: *yellow
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *selection
      focusColor: *current_line
    menu:
      fgColor: *foreground
      keyColor: *magenta
      numKeyColor: *magenta
    crumbs:
      fgColor: *foreground
      bgColor: *current_line
      activeColor: *current_line
    status:
      newColor: *cyan
      modifyColor: *blue
      addColor: *green
      errorColor: *red
      highlightColor: *yellow
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: *current_line
      highlightColor: *yellow
      counterColor: *magenta
      filterColor: *cyan
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *blue
        - *red
      defaultChartColors:
        - *blue
        - *red
    table:
      fgColor: *foreground
      bgColor: *background
      header:
        fgColor: *foreground
        bgColor: *background
        sorterColor: *cyan
    xray:
      fgColor: *foreground
      bgColor: *background
      cursorColor: *current_line
      graphicColor: *blue
      showIcons: false
    yaml:
      keyColor: *magenta
      colonColor: *blue
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: *background
      indicator:
        fgColor: *foreground
        bgColor: *magenta
        toggleOnColor: *green
        toggleOffColor: *cyan
