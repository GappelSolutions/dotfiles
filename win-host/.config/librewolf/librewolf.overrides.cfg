// LibreWolf autoconfig overrides, copied to %USERPROFILE%\.librewolf\ by install.ps1.
// Runs privileged: install.ps1 also drops general.config.sandbox_enabled=false into the install dir.

// Restore pinned tabs lazily. Firefox always gives pinned tabs a real browser at startup
// (Tabbrowser.createTabsForSessionRestore: createLazyBrowser = ... && !tabData.pinned), so every
// pinned site starts its own content process while the window comes up. Restore them as normal
// lazy tabs and pin them afterwards; pinning keeps a lazy tab unloaded.
Services.obs.addObserver(function lazyPinned() {
  Services.obs.removeObserver(lazyPinned, "final-ui-startup");
  try {
    const { Tabbrowser } = ChromeUtils.importESModule(
      "moz-src:///browser/components/tabbrowser/Tabbrowser.sys.mjs"
    );
    const original = Tabbrowser.prototype.createTabsForSessionRestore;
    Tabbrowser.prototype.createTabsForSessionRestore = function (lazily, selectTab, tabDataList, ...rest) {
      if (!lazily) return original.call(this, lazily, selectTab, tabDataList, ...rest);
      // all pins (the selected one too) get pinned afterwards, in order, so their order is kept
      const pinLater = [];
      const list = tabDataList.map((tabData, i) => {
        if (!tabData.pinned) return tabData;
        pinLater.push(i);
        return { ...tabData, pinned: false };
      });
      const tabs = original.call(this, lazily, selectTab, list, ...rest);
      for (const i of pinLater) this.pinTab(tabs[i]);
      return tabs;
    };
  } catch (e) {
    Cu.reportError(e);
  }
}, "final-ui-startup");
