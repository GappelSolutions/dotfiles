# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard, hand-edited to mirror the
# previous komorebi-bar layout: launcher | workspaces | active window
# ... claude usage | wifi | clock+calendar | battery
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - launcher
      - komorebi_workspaces
      - active_window
      right:
      - claude_usage
      - wifi
      - volume
      - clock
      - battery
widgets:
  launcher:
    type: yasb.custom.CustomWidget
    options:
      class_name: launcher-widget
      label: "<span></span>"
      callbacks:
        on_left: 'exec explorer.exe shell:AppsFolder\Raycast.Raycast_qypenmj9wpt2a!Raycast'
        on_middle: do_nothing
        on_right: do_nothing
  komorebi_workspaces:
    type: komorebi.workspaces.WorkspaceWidget
    options:
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      hide_empty_workspaces: false
      enable_scroll_switching: true
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 40
      max_length_ellipsis: '...'
      monitor_exclusive: false
  claude_usage:
    type: yasb.claude_usage.ClaudeUsageWidget
    options:
      label: 'Claude {five_hour}% ({five_hour_reset}) · 7d {seven_day}% ({seven_day_reset})'
      label_alt: '{five_hour}% ({five_hour_reset}) · 7d {seven_day}% ({seven_day_reset})'
      update_interval: 60
      cache_ttl: 120
      five_hour_reset_format: relative
      seven_day_reset_format: relative
      callbacks:
        on_left: toggle_menu
        on_middle: refresh
        on_right: toggle_label
  wifi:
    type: yasb.wifi.WifiWidget
    options:
      label: '{wifi_icon} {wifi_name}'
      label_alt: '{wifi_icon} {wifi_name}'
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: ""
        '10': ""
        '30': ""
        '60': ""
        '100': ""
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: false
        show_app_labels: false
        show_app_icons: false
        show_apps_expanded: false
        app_icons:
          toggle_down: ""
          toggle_up: ""
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a %d %b %H:%M:%S}'
      label_alt: '{%a, %d %b %H:%M:%S}'
      calendar:
        blur: true
        round_corners: true
        alignment: right
        direction: down
        extended: true
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  battery:
    type: yasb.battery.BatteryWidget
    options:
      label: '{icon} {percent}%'
      label_alt: '{percent}% | remaining: {time_remaining}'
      charging_options:
        icon_format: '{charging_icon}'
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
