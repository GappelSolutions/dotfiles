# Windows-native Alacritty. Synced to %APPDATA%\alacritty\ by win-host/sync.sh
# together with alacritty/.config/alacritty/base.toml.
[general]
import = ["base.toml"]

# Mono variant: ConPTY renders the proportional nerd-font glyphs double-width.
[font.normal]
family = "FiraCode Nerd Font Mono"

[selection]
save_to_clipboard = false

[terminal]
osc52 = "Disabled"

# entry.cmd prompts for native pwsh + Windows zellij or WSL.
[terminal.shell]
program = "cmd.exe"
args = ["/c", "%APPDATA%\\alacritty\\entry.cmd"]

# WSL/ConPTY collapses extended Ctrl+Shift modifier reporting down to
# plain Ctrl, so zellij never sees it as a distinct combo. Fake Alt
# instead via raw ESC+char bytes (survives ConPTY untouched).
[[keyboard.bindings]]
key = "H"
mods = "Control|Shift"
chars = "\u001bh"

[[keyboard.bindings]]
key = "J"
mods = "Control|Shift"
chars = "\u001bj"

[[keyboard.bindings]]
key = "K"
mods = "Control|Shift"
chars = "\u001bk"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
chars = "\u001bl"

[[keyboard.bindings]]
key = "M"
mods = "Control|Shift"
chars = "\u001bm"

# Ctrl+Shift+N -> new pane (Alt n in zellij). NOTE: Ctrl+Shift+X and
# Ctrl+Shift+[ / ] get swallowed by a Windows-side global before Alacritty
# sees them, so close-pane / swap-layout binds cannot work here.
[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
chars = "\u001bn"


[[keyboard.bindings]]
key = "!"
mods = "Control|Shift"
chars = "\u001b1"

[[keyboard.bindings]]
key = "@"
mods = "Control|Shift"
chars = "\u001b2"

[[keyboard.bindings]]
key = "#"
mods = "Control|Shift"
chars = "\u001b3"

[[keyboard.bindings]]
key = "$"
mods = "Control|Shift"
chars = "\u001b4"

[[keyboard.bindings]]
key = "%"
mods = "Control|Shift"
chars = "\u001b5"

[[keyboard.bindings]]
key = "^"
mods = "Control|Shift"
chars = "\u001b6"

[[keyboard.bindings]]
key = "&"
mods = "Control|Shift"
chars = "\u001b7"

[[keyboard.bindings]]
key = "*"
mods = "Control|Shift"
chars = "\u001b8"

[[keyboard.bindings]]
key = "("
mods = "Control|Shift"
chars = "\u001b9"

[[keyboard.bindings]]
key = ")"
mods = "Control|Shift"
chars = "\u001b0"
